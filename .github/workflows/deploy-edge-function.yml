name: Deploy Edge Function

on:
  workflow_dispatch:
    inputs:
      function:
        description: Edge Function to operate on
        required: true
        type: choice
        options:
          - admin-read
      mode:
        description: check is read-only; deploy and delete change the live project
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy
          - delete
      confirm_project_ref:
        description: deploy/delete only; enter the exact target project ref
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Edge Functions locally
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Validate deployment allowlist
        run: npm run verify:edge-function-config

      - name: Check formatting
        run: deno fmt --check --config supabase/functions/deno.json supabase/functions

      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Type-check
        run: deno task --config supabase/functions/deno.json check

      - name: Test
        run: deno task --config supabase/functions/deno.json test

  deploy:
    name: Run protected Edge Function operation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      EDGE_FUNCTION_NAME: ${{ inputs.function }}
      EDGE_FUNCTION_MODE: ${{ inputs.mode }}
      EDGE_FUNCTION_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Edge Function operations must run from refs/heads/master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate deployment allowlist
        run: npm run verify:edge-function-config

      - name: Run Edge Function operation
        run: npm run deploy:edge-function

name: Verify Supabase

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-edge-function.yml"
      - ".github/workflows/deploy-supabase.yml"
      - ".github/workflows/verify-supabase.yml"
      - "package.json"
      - "scripts/deploy-edge-function.mjs"
      - "scripts/deploy-supabase-remote.mjs"
      - "scripts/verify-supabase-preparation.mjs"
      - "supabase/**"
      - "tsconfig.json"
  push:
    branches:
      - master
      - production
    paths:
      - ".github/workflows/deploy-edge-function.yml"
      - ".github/workflows/deploy-supabase.yml"
      - ".github/workflows/verify-supabase.yml"
      - "package.json"
      - "scripts/deploy-edge-function.mjs"
      - "scripts/deploy-supabase-remote.mjs"
      - "scripts/verify-supabase-preparation.mjs"
      - "supabase/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Database migration replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate remote deployment allowlist
        run: npm run verify:supabase-remote-config

      - name: Validate Edge Function deployment allowlist
        run: npm run verify:edge-function-config

      - name: Start local database
        run: supabase db start

      - name: Replay migrations
        run: supabase db reset

      - name: Lint database
        run: supabase db lint --level error

      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Function test runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Check formatting
        run: deno fmt --check --config supabase/functions/deno.json supabase/functions

      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Type-check
        run: deno task --config supabase/functions/deno.json check

      - name: Test
        run: deno task --config supabase/functions/deno.json test

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute base path
        id: base_path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            echo "value=${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Show deployment target
        shell: bash
        run: |
          if [ -z "${{ steps.base_path.outputs.value }}" ]; then
            echo "Building GitHub Pages site for root base path (/)."
          else
            echo "Building GitHub Pages site for base path: ${{ steps.base_path.outputs.value }}"
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base_path.outputs.value }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jfmwdbzxypgxthahaylp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_jmlhw6DPSgPWSUgNZotByg_tFlpMIrL' }}
        run: npm run build

      - name: Verify static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base_path.outputs.value }}
        run: npm run verify:export

      - name: Verify admin isolation
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base_path.outputs.value }}
        run: npm run verify:admin-isolation

      - name: Prepare Pages payload
        run: touch out/.nojekyll

      - name: Publish to gh-pages branch
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$(mktemp -d)"

          cp -a out/. "$DEPLOY_DIR"/
          git -C "$DEPLOY_DIR" init -b gh-pages
          git -C "$DEPLOY_DIR" config user.name "github-actions[bot]"
          git -C "$DEPLOY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DEPLOY_DIR" add -A
          git -C "$DEPLOY_DIR" commit -m "Deploy ${GITHUB_SHA}"
          git -C "$DEPLOY_DIR" remote add origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$DEPLOY_DIR" push --force origin gh-pages

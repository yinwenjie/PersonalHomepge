name: RSS Proxy Smoke Check

# Post-deploy check for rss-proxy: one real read, then 61 requests with forged client-address
# headers that must end rate limited. Changes only rate-limit counters and one cached feed.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Enter the exact target project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  smoke:
    name: Check rss-proxy reads and rate limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SMOKE_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      # The website's public key, the same fallback deploy-pages.yml builds with.
      PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_jmlhw6DPSgPWSUgNZotByg_tFlpMIrL' }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "The smoke check must run from refs/heads/master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Run smoke check
        timeout-minutes: 6
        run: node scripts/rss-proxy-smoke.mjs

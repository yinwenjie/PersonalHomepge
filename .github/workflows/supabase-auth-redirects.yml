name: Supabase Auth redirect URLs

# Phase 1.18 step 5: allow the admin site (https://admin.mylinker.net/) as a sign-in redirect.
# check is read-only; apply only appends the missing URL and reads the list back. Never
# removes entries or changes the Site URL. Needs the owner to approve supabase-production.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check is read-only; apply adds the missing URL
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
      confirm_project_ref:
        description: Apply only; enter the exact target project ref
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  redirects:
    name: Supabase Auth redirect URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      AUTH_REDIRECT_MODE: ${{ inputs.mode }}
      AUTH_REDIRECT_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Supabase Auth changes must run from refs/heads/master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Check or add the admin redirect URL
        run: node scripts/supabase-auth-redirects.mjs

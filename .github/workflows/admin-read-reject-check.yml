name: Admin Read Reject Check

# Post-deploy check for admin-read: requests without an administrator session must be refused.
# Uses only the public anon key; reads no data and writes no audit rows.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Enter the exact target project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  reject:
    name: Check admin-read refuses unauthenticated requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      CHECK_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "The check must run from refs/heads/master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Run reject check
        timeout-minutes: 6
        run: node scripts/admin-read-reject-check.mjs
